name: Build tdesktop Windows (m3eGram MD3 Expressive, experimental)

on:
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64 (MSVC, VS2022 v143 toolset)
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Verify API credentials
        shell: bash
        env:
          ID: ${{ secrets.TDESKTOP_API_ID }}
          HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if [ -z "$ID" ] || [ -z "$HASH" ]; then
            echo "::error::Add repository secrets TDESKTOP_API_ID and TDESKTOP_API_HASH. Get them free at https://my.telegram.org → 'API development tools'."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Apply m3eGram lib_ui MD3 patches (palette + shapes)
        shell: bash
        working-directory: Telegram/lib_ui
        run: git apply --verbose "$GITHUB_WORKSPACE/patches/lib-ui-md3.patch"

      # windows-2022: default toolset v143/14.44 matches cmake_helpers -T v143,
      # ~100GB on D: for Libraries (windows-2025-vs2026 lost D:\ and has ~33GB)
      # C3859/C1076 (PCH virtual memory / heap limit) = commit-charge exhaustion:
      # bump the pagefile so 4 parallel cl.exe can map the huge PCH safely
      - uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 32GB
          disk-root: 'D:'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare libraries (downloads and builds Qt/FFmpeg/openssl etc, slow)
        shell: cmd
        run: Telegram\build\prepare\win.bat

      - name: Configure x64
        shell: cmd
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          cd Telegram
          configure.bat x64 -D TDESKTOP_API_ID=%TDESKTOP_API_ID% -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH%

      - name: Build
        shell: cmd
        env:
          # /Zd (line-number-only debug info) overrides the project's /Z7 via
          # D9025 last-wins. Fixes BOTH failure modes seen in this job:
          #  - no C1060 (cl generates far less debug info than /Z7 or /Zi)
          #  - no shared vc143.pdb LIMIT(12) / C2471 cascade: the compile-time
          #    PDB stays tiny; /Zi pushed ~1200 TUs of full debug info into one
          #    PDB that hit the PDB format ceiling (error code 12 = LIMIT).
          _CL_: /Zd /Zf
          # Link-side insurance: raise the Telegram.pdb page ceiling from the
          # default 4 GiB (4KiB pages) to 16 GiB, so /DEBUG link can never hit
          # LNK1318 "Unexpected PDB error; LIMIT (12)".
          _LINK_: /pdbpagesize:16384
        run: |
          cd Telegram
          cmake --build ../out --config Release --target Telegram -- /m:2

      - name: Collect artifacts
        shell: bash
        run: |
          find out -maxdepth 2 -type f | head -30
          mkdir -p dist
          cp -v out/Release/Telegram.exe dist/Telegram-m3e-expressive-win64.exe
          cp -v out/Release/*.pdb dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: tdesktop-m3e-expressive-win64
          path: dist/
          if-no-files-found: error
